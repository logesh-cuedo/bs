        unique_key:
          - ENQUIRY_DTLS_ID
        partition_key: AUDIT_LOG.CREATED_DATE
        created_timestamp: AUDIT_LOG.CREATED_DATE
        updated_timestamp: AUDIT_LOG.MODIFIED_DATE
