  - name: idp
    secrets_name: mysql-db-secrets-pod
    disaster_recovery: False
    schema:
      prod: pod
      dev: SFPODBETA
      qa: SFPODBETA
      uat: SFPODBETA
    bigquery_dataset: ds_sfl_adp_stg_idp
    chunk_size: 10 # Sequential Table Processing with Chunk Size in Dag Airflow
    tables:
      - table_name: POD_TB_LOG_HDR
        audit_log: True
        primary_key:
          - POD_LOG_HDR_ID
        unique_key:
        partition_key: DOCUMENT_TYPE
        created_timestamp: CREATED_DATE
        updated_timestamp: MODIFIED_DATE
        incremental_schedule: '0 4 * * *'
        incremental_logic: " FROM schema.table_name br where br.created_date > timestamp('%1') AND br.modified_date > timestamp('%2')"
      # incremental_logic: " FROM schema.table_name br JOIN schema.POD_TB_LOG_DTLS B ON br.POD_LOG_HDR_ID = B.POD_LOG_HDR_ID WHERE B.DOCUMENT_STATUS = 'NS' AND br.modified_date > timestamp('%2')"

      - table_name: POD_TB_LOG_DTLS
        audit_log: True
        primary_key:
          - POD_LOG_DTL_ID
        unique_key:
        partition_key: DOCUMENT_STATUS
        created_timestamp: CREATED_DATE
        updated_timestamp: MODIFIED_DATE
        incremental_schedule: '0 4 * * *'
        incremental_logic: " FROM schema.POD_TB_LOG_HDR A JOIN schema.table_name br ON A.POD_LOG_HDR_ID = br.POD_LOG_HDR_ID WHERE br.DOCUMENT_STATUS = 'NS' AND br.modified_date > timestamp('%2')"

